<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account — RideConnect SA</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🚖 RideConnect SA
    </div>

    <div class="nav-buttons">

        <a href="index.html">
            <button class="secondary-btn">Back Home</button>
        </a>

    </div>

</header>

<div class="auth-page">

    <div class="card auth-card">

        <h3>Create Your Account</h3>

        <p class="auth-subtext">
            Save your ride history and track your trips in real time.
        </p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <button type="submit" class="book-btn">Create Account</button>

        </form>

        <p id="message" class="auth-message"></p>

        <p class="auth-switch">
            Already have an account? <a href="passenger-login.html">Log in</a>
        </p>

    </div>

</div>

<script src="passenger-register.js"></script>

</body>

</html>
