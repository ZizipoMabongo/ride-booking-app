<!DOCTYPE html>
<html>
<head>
    <title>Ride Booking Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<div class="login-container">

<h1>Ride Booking App</h1>

<h2>Login</h2>

<p id="message"></p>

</div>


<script src="login.js"></script>

</body>
</html>
