<!DOCTYPE html>
<html>
<head>
    <title>Driver Dashboard</title>

    <style>
        body {

            background: #f4f4f4;

        }

        h1 {
            color: #1f2937;
        }

        .ride {
            background:white;
            padding:20px;

<body>

<h1>🚗 Driver Dashboard</h1>

<div id="rides"></div>
