<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Driver Dashboard</title>

<link rel="stylesheet" href="driver.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🚖 Driver Dashboard
    </div>

    <div class="nav-buttons">

        <button id="statusBtn" class="primary-btn">
            🟢 Online
        </button>

        <button id="logoutBtn" class="secondary-btn">
            Logout
        </button>

    </div>

</header>

<div class="main-layout">

    <!-- Left Panel -->

    <aside class="sidebar">

        <div class="welcome-card">

            <h2 id="driverName">
                Welcome Driver 👋
            </h2>

            <p>
                Ready to accept new rides.
            </p>

        </div>

        <div class="card">

            <h3>Today's Summary</h3>

            <div class="summary-row">

                <span>🚖 Trips</span>

                <strong id="tripCount">
                    0
                </strong>

            </div>

            <div class="summary-row">

                <span>💰 Earnings</span>

                <strong id="earnings">
                    R0
                </strong>

            </div>

            <div class="summary-row">

                <span>📍 Active Rides</span>

                <strong id="activeRides">
                    0
                </strong>

            </div>

        </div>

        <div class="card">

            <h3>Status</h3>

            <p id="driverStatus">
                🟢 Online
            </p>

        </div>

    </aside>

    <!-- Right Panel -->

    <section
        style="
        flex:1;
        padding:30px;
        overflow-y:auto;
        ">

        <h2
        style="
        color:#1E3A8A;
        margin-bottom:20px;
        ">
            Incoming Ride Requests
        </h2>

        <div id="rides">

            <!-- driver.js inserts rides here -->

        </div>

    </section>

</div>

<script>

const logout=document.getElementById("logoutBtn");

logout.addEventListener("click",()=>{

localStorage.removeItem("driverToken");

window.location.href="login.html";

});

const statusBtn=document.getElementById("statusBtn");
const status=document.getElementById("driverStatus");

let online=true;

statusBtn.addEventListener("click",()=>{

online=!online;

if(online){

statusBtn.innerHTML="🟢 Online";
status.innerHTML="🟢 Online";

}else{

statusBtn.innerHTML="🔴 Offline";
status.innerHTML="🔴 Offline";

}

});

</script>

<script src="driver.js"></script>

</body>

</html>
